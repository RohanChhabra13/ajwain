services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workplatform
      POSTGRES_USER: workplatform
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workplatform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workplatform"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/workplatform
      DB_USER: workplatform
      DB_PASSWORD: ${DB_PASSWORD:-workplatform}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-dev-only-secret-dev-only-secret-1234}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
